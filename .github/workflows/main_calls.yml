name: Build and deploy JAR app to Azure Web App - calls

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/target/*.jar'

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A1E7B6D103174B6ABC96E789EFD1A264 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EC287101A0374FBDB20C408245A577CE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0C309D63995E4283933039D99D1760B3 }}

      - name: Set Azure App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'calls'
          slot-name: 'Production'
          app-settings-json: |
            {
              "DB_URI": ${{ toJson(secrets.DB_URI) }},
              "SPRING_DATA_MONGODB_AUTO_INDEX_CREATION": ${{ toJson(secrets.SPRING_DATA_MONGODB_AUTO_INDEX_CREATION) }},
              "DB_NAME": ${{ toJson(secrets.DB_NAME) }},
              "SERVER_PORT": ${{ toJson(secrets.SERVER_PORT) }},
              "USERS_BASE": ${{ toJson(secrets.USERS_BASE) }},
              "USERS_PUBLIC_PATH": ${{ toJson(secrets.USERS_PUBLIC_PATH) }},
              "RESERVATIONS_BASE": ${{ toJson(secrets.RESERVATIONS_BASE) }},
              "UPLEARN_ALLOWED_ORIGINS": ${{ toJson(secrets.UPLEARN_ALLOWED_ORIGINS) }},
              "CALL_MAX_MINUTES": ${{ toJson(secrets.CALL_MAX_MINUTES) }},
              "WS_MAX_MESSAGE_SIZE": ${{ toJson(secrets.WS_MAX_MESSAGE_SIZE) }},
              "WS_HEARTBEAT_SECONDS": ${{ toJson(secrets.WS_HEARTBEAT_SECONDS) }},
              "WS_IDLE_TIMEOUT_SECONDS": ${{ toJson(secrets.WS_IDLE_TIMEOUT_SECONDS) }},
              "WS_RATE_LIMIT": ${{ toJson(secrets.WS_RATE_LIMIT) }},
              "STUN_URLS": ${{ toJson(secrets.STUN_URLS) }},
              "TURN_USERNAME": ${{ toJson(secrets.TURN_USERNAME) }},
              "TURN_PASSWORD": ${{ toJson(secrets.TURN_PASSWORD) }}
            }

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'calls'
          slot-name: 'Production'
          package: '*.jar'
